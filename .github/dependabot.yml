version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per month for all workspace dependencies (pnpm lockfile is resolved from the root).
      workspace-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
